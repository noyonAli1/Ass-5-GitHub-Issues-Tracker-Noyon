<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>
    <!-- tailwind + daisy -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="tailwind.css">
    <!-- faveicon add -->
    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">
    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: "Geist", sans-serif;
        }
    </style>

    <!-- font osam cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="bg-[#F8FAFC]">
    <!-- navber ar kaj kora hobe  -->
    <header>
        <!-- Navbar -->
        <div class="navbar bg-base-100 shadow px-6">


            <div class="flex-1 flex items-center gap-2">
                <img src="./assets/github-logo.png" class="w-7">
                <h1 class="hidden lg:block text-lg font-semibold"> GitHub Issues Tracker</h1>
            </div>


            <div class="flex-none flex items-center gap-2 md:gap-3">

                <div class="form-control">
                    <input id="input-scarich" type="text" placeholder="Search issues..."
                        class="input input-bordered w-36 sm:w-44 md:w-56 lg:w-72 border-gray-400 text-sm md:text-base outline-none" />
                </div>

                <button id="btn-Scarch"
                    class="btn text-white border-0 bg-[#4f46e5] text-xs sm:text-sm md:text-base px-2 md:px-4">
                    + New Issue
                </button>

            </div>

        </div>
    </header>
    <!-- card + all button section kaj kora hobe -->
    <main class="container mx-auto mt-15">
        <div class="bg-white p-4  shadow-md flex gap-3 mb-6">

            <button onclick="allcards()"
                class="btn btn-outline px-8 border-gray-400 bg-green-600 text-white">All</button>
            <button onclick="fetchOpenCards()" class="btn btn-outline px-7 border-gray-400">Open</button>
            <button onclick="fetchCloseCards()" class="btn btn-outline px-7 border-gray-400">Closed</button>

        </div>
        <!-- all card.. -->
        <section class="bg-white p-4 shadow-md mb-6">

            <div class="flex items-center justify-between w-full">

                <div class="flex items-center gap-2">
                    <img src="./assets/Aperture.png" alt="" class="p-2 bg-blue-200 rounded-full">

                    <div>
                        <h2 id="issus-count" class="font-bold text-lg">0 Issues</h2>
                        <p class="text-sm text-gray-500">
                            Track and manage your project issues
                        </p>
                    </div>
                </div>

                <div class="flex gap-4 text-sm">
                    <span class="flex items-center gap-1">
                        <span class="w-2 h-2 bg-green-500 rounded-full"></span>Open</span>

                    <span class="flex items-center gap-1">
                        <span class="w-2 h-2 bg-purple-500 rounded-full"></span>Closed</span>
                </div>

            </div>

        </section>

        <!-- //.......lodding kaj korbe ................. all button card dainamik..-->

        <div id="spinner-div" class="flex justify-center items-center min-h-80 hidden">
            <span class="loading loading-bars loading-xl"></span>
        </div>
        <!-- //alll -->
        <!-- <section id="all-card" class=" grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">

        </section> -->
          
        <section id="all-card" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 px-2 md:px-6 lg:px-0">
            
       </section>
    </main>
    <!-- Open the modal using ID.showModal() method -->
    <!-- <button class="btn" onclick="my_modal_1.showModal()">open modal</button> -->
    <dialog id="my_modal_1" class="modal">
        <div class="modal-box">
            <div id="modal-content">

            </div>


            <!-- /// -->
        </div>

        </div>
    </dialog>


    <script src="./card.js"></script>
</body>

</html>
